name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `id-token: write` is required for the Codecov OIDC upload below.
    # `contents: read` repeats the workflow-level default explicitly, since
    # adding any job-level `permissions:` block resets all unspecified scopes
    # to none.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Deliberately floating: CI is where an incompatibility with a new uv
          # should show up. The publishing workflow pins its version instead.
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run tests with coverage
        run: uv run python -m pytest --cov-report=xml --cov-report=term

      - name: Check per-module coverage floors
        # The project-wide threshold hides a large module falling behind,
        # carried by small well covered ones; this step checks every module
        # against its own floor.
        run: uv run python scripts/coverage_gate.py

      - name: Upload coverage to Codecov
        # Run on a single matrix entry — uploading the same report on every
        # Python version of the matrix just creates noise on the Codecov side
        # without changing what we measure.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          # OIDC removes the need for a long-lived CODECOV_TOKEN secret —
          # the action exchanges a short-lived GitHub-issued JWT for an
          # upload credential, which Codecov verifies by repository claim.
          use_oidc: true
          files: ./coverage.xml
          flags: unit
          # Don't fail the build on Codecov outages — coverage drift is
          # signal, not a release blocker.
          fail_ci_if_error: false

  lowest-direct:
    # The declared lower bounds are what a user with an older environment
    # actually installs, and nothing checked that the project works there: the
    # lock file pins the newest of everything, so a bound raised too late (or
    # never raised at all) stayed invisible. `lowest-direct` takes the lowest
    # release allowed for every direct dependency and the usual resolution for
    # the rest.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install the lowest allowed direct dependencies
        run: uv sync --resolution lowest-direct

      - name: Run tests
        # Without coverage: the floors are measured on the matrix above, and
        # this job answers one question -- does the code run on the versions
        # the manifest says it supports.
        run: uv run python -m pytest --no-cov
