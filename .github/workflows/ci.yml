name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `id-token: write` is required for the Codecov OIDC upload below.
    # `contents: read` repeats the workflow-level default explicitly, since
    # adding any job-level `permissions:` block resets all unspecified scopes
    # to none.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run tests with coverage
        run: uv run python -m pytest --cov-report=xml --cov-report=term

      - name: Check per-module coverage floors
        # Общий порог маскирует провал крупного модуля за счёт мелких хорошо
        # покрытых; этот шаг сверяет каждый модуль с его собственной границей.
        run: uv run python scripts/coverage_gate.py

      - name: Upload coverage to Codecov
        # Run on a single matrix entry — uploading the same report three
        # times under different Python versions just creates noise on the
        # Codecov side without changing what we measure.
        if: matrix.python-version == '3.12'
        # codecov/codecov-action pinned to v6.0.1
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          # OIDC removes the need for a long-lived CODECOV_TOKEN secret —
          # the action exchanges a short-lived GitHub-issued JWT for an
          # upload credential, which Codecov verifies by repository claim.
          use_oidc: true
          files: ./coverage.xml
          flags: unit
          # Don't fail the build on Codecov outages — coverage drift is
          # signal, not a release blocker.
          fail_ci_if_error: false
