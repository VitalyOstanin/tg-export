name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Права распределены по задачам, а не выданы всему конвейеру: GitHub кладёт
# ACTIONS_ID_TOKEN_REQUEST_URL и ACTIONS_ID_TOKEN_REQUEST_TOKEN в окружение
# КАЖДОГО шага job'а, объявившего id-token, поэтому обменять их на upload-token
# PyPI может любой шаг -- в том числе `uv sync`, исполняющий build-backend'ы
# зависимостей, и прогон тестов. Публикация в PyPI необратима, поэтому job с
# id-token не содержит ничего, кроме скачивания артефакта и загрузки.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run all checks
        # Гейт перед публикацией: релиз делается из тега, ci.yml на тег не
        # триггерится, поэтому здесь прогоняется тот же набор проверок, что и
        # на master -- uv lock --check, ruff check, ruff format --check,
        # pyright, тесты с покрытием и границы покрытия по модулям. Прежде тут
        # был только pytest, и тег на коммите с рассинхронизированным uv.lock
        # или с ошибками типов публиковался беспрепятственно.
        run: scripts/check.sh

      - name: Verify tag, manifest and CHANGELOG agree
        # Сверка идёт ДО публикации: единственная проверка CHANGELOG стояла
        # ниже загрузки на PyPI, поэтому отсутствующий раздел давал
        # опубликованную версию, отсутствующий GitHub Release и красный
        # workflow -- отката у PyPI нет. Здесь же готовятся release notes.
        run: uv run python scripts/release_notes.py "$GITHUB_REF_NAME" --output release_notes.md

      - name: Build package
        run: uv build

      - name: Smoke test built wheel
        # Установить собранный wheel в изолированное эфемерное окружение и
        # убедиться, что он не только запускается, но и умеет рендерить.
        # Why not just --version: точка входа стартует и на пакете, куда не
        # попали Jinja-шаблоны и статика, а экспорт в такой сборке падает с
        # TemplateNotFound. Скрипт компилирует все шаблоны и рендерит index.
        # Why cd: из корня репозитория импортировался бы исходный tg_export,
        # а не установленный, и проверка стала бы бессмысленной.
        run: |
          set -euo pipefail
          WHEEL=$(ls "$PWD"/dist/*.whl)
          SCRIPT="$PWD/scripts/smoke_installed_package.py"
          uv run --no-project --with "$WHEEL" tg-export --version
          uv run --no-project --with "$WHEEL" tg-export --help
          cd "$(mktemp -d)"
          uv run --no-project --with "$WHEEL" python "$SCRIPT"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Единственное право этого job'а: обменять OIDC-токен на upload-token
      # PyPI. Стороннего кода здесь не выполняется.
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # PEP 740: артефакты подписываются через тот же OIDC, что и загрузка,
          # и PyPI показывает, каким workflow собран пакет. Значение совпадает
          # с умолчанием действия и задано явно: умолчание может измениться, а
          # публикация необратима, и потерю аттестаций заметили бы не сразу.
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write нужен для gh release create; id-token здесь не нужен.
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --latest
