name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Permissions are handed out per task rather than to the whole pipeline:
# GitHub puts ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN
# into the environment of EVERY step of a job that declares id-token, so any
# step could trade them for a PyPI upload token -- including `uv sync`, which
# runs the build backends of the dependencies, and the test run. A PyPI upload
# cannot be undone, so the job holding id-token does nothing but download the
# artifact and upload it.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Pinned: this job builds the wheel next to the right to publish it,
          # and the action pin fixes the installer, not uv itself. Raised
          # deliberately, unlike the floating version CI runs on.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run all checks
        # The gate before publishing: a release is cut from a tag and ci.yml
        # does not trigger on tags, so the same set of checks master gets runs
        # here -- uv lock --check, ruff check, ruff format --check, pyright,
        # the tests with coverage and the per-module coverage floors. This used
        # to be pytest alone, and a tag on a commit with an out-of-sync uv.lock
        # or with type errors published unhindered.
        run: scripts/check.sh

      - name: Verify tag, manifest and CHANGELOG agree
        # The check runs BEFORE publishing: the only CHANGELOG check used to
        # sit below the PyPI upload, so a missing section produced a published
        # version, no GitHub Release and a red workflow -- and PyPI has no
        # undo. The release notes are prepared by the same step.
        run: uv run python scripts/release_notes.py "$GITHUB_REF_NAME" --output release_notes.md

      - name: Build package
        run: uv build

      - name: Smoke test built wheel
        # Install the built wheel into an isolated ephemeral environment and
        # check that it not only starts but can render.
        # Why not just --version: the entry point starts even on a package the
        # Jinja templates and the static files never made it into, while an
        # export from such a build fails with TemplateNotFound. The script
        # compiles every template and renders the index.
        # Why cd: from the repository root the source tg_export would be
        # imported instead of the installed one, and the check would be void.
        run: |
          set -euo pipefail
          WHEEL=$(ls "$PWD"/dist/*.whl)
          SCRIPT="$PWD/scripts/smoke_installed_package.py"
          uv run --no-project --with "$WHEEL" tg-export --version
          uv run --no-project --with "$WHEEL" tg-export --help
          cd "$(mktemp -d)"
          uv run --no-project --with "$WHEEL" python "$SCRIPT"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only power of this job: trade the OIDC token for a PyPI upload
      # token. No third-party code runs here.
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # PEP 740: the artifacts are signed through the same OIDC as the
          # upload, and PyPI shows which workflow built the package. The value
          # matches the action's default and is stated anyway: a default can
          # change, publishing is irreversible, and losing the attestations
          # would go unnoticed for a while.
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write is what gh release create needs; id-token is not.
      contents: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --latest
