# Version updates. Actions are pinned by commit SHA, which never moves on its
# own: without this file a fix released in any of them -- the PyPI uploader
# included -- would reach the project only if someone went looking for it.
# Dependabot rewrites the SHA and the tag comment next to it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Python dependencies are locked in uv.lock, and a fix released in any of
  # them reached the project only when somebody went looking: the security
  # bounds written into the manifest by hand (setuptools, jinja2, click) are
  # what that looks like. Dependabot supports the uv ecosystem even though the
  # overview page of the documentation does not list it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
