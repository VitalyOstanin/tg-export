[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-export"
version = "1.5.1"
description = "Flexible Telegram data export tool"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Vitaly Ostanin", email = "vitaly.ostanin@gmail.com"}]
# What is declared is what CI exercises: Linux and the Python versions of the
# matrix. On Windows the session file lock degrades into a no-op (no fcntl) and
# the signal handlers are not installed -- it can run, but it is not verified.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    # Upper bound: Telethon v2 rewrites the session layer, and SQLiteSession --
    # which FixedSQLiteSession subclasses to work around the column-order bug --
    # does not exist there in its current form.
    "telethon>=1.36,<2",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    # 3.1.6 is the first release without the five sandbox-escape and
    # attribute-injection advisories that affect 3.1.0-3.1.5.
    "jinja2>=3.1.6",
    # 8.3.3 fixes the command injection in click.edit() (CVE-2026-7246). The
    # project never calls that function; the floor keeps it out of anyone's
    # environment regardless.
    "click>=8.3.3",
    "rich>=15.0",
]

[project.urls]
Homepage = "https://github.com/VitalyOstanin/tg-export"
Repository = "https://github.com/VitalyOstanin/tg-export"
Issues = "https://github.com/VitalyOstanin/tg-export/issues"

[project.optional-dependencies]
proxy = [
    # Why python-socks: Telethon (1.43+) checks `python_socks` and silently
    # ignores `proxy=` if it's missing (warns "proxy argument will be ignored
    # because python-socks is not installed"). PySocks is a legacy fallback
    # path in telethon and gated by the same check, so it never runs in
    # practice. The `[asyncio]` extra is required by Telethon's async client.
    # Upper bound: python-socks 3.0.0 (2026-08-11) is a major step, and Telethon
    # patches private internals of this library (python_socks._errors) rather
    # than using its public API only. The combination has not been exercised.
    "python-socks[asyncio]>=2.0,<3",
]

# Development tools are a group (PEP 735), not an extra: an extra lands in the
# wheel metadata and is offered to the installer, while a group exists only in
# the source tree. The practical effect is that `uv sync` installs the `dev`
# group by default, so asking for another set (`uv sync --extra proxy`) no
# longer washes pytest and ruff out of the environment.
[dependency-groups]
# Lower bounds state what the project is verified against (see uv.lock), not
# the oldest version it once built with: an environment created without the
# lock file would otherwise get a different tool. pytest-asyncio 1.x is a case
# of its own -- in 0.x the `asyncio_mode = "auto"` mode behaved differently.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "pyright>=1.1.411",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --cov lives here, not only in CI: without it the fail_under threshold is not
# checked locally and a drop in coverage surfaces only after the push.
addopts = "-ra --strict-markers --strict-config --cov=tg_export"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:telethon",
]
timeout = 60

[tool.coverage.run]
source = ["tg_export"]

[tool.coverage.report]
# Project-wide floor. Checked by every run with --cov (see addopts).
fail_under = 50

# Per-module floors: the project-wide threshold on its own hides a large file
# falling behind, carried by well covered small ones. The values sit slightly
# below the current numbers, to catch a regression rather than to demand
# growth. Checked by scripts/coverage_gate.py after a run with --cov.
[tool.tg-export.coverage-floor]
"tg_export/__init__.py" = 100
"tg_export/html/__init__.py" = 100
"tg_export/__main__.py" = 0
"tg_export/api.py" = 50
"tg_export/auth.py" = 50
"tg_export/catalog.py" = 40
"tg_export/cli/__init__.py" = 90
"tg_export/cli/account.py" = 50
"tg_export/cli/auth.py" = 55
"tg_export/cli/common.py" = 85
"tg_export/cli/export.py" = 45
"tg_export/cli/state.py" = 45
"tg_export/cli/takeout.py" = 70
"tg_export/cli/tg.py" = 60
"tg_export/config.py" = 85
"tg_export/console.py" = 100
"tg_export/converter.py" = 30
"tg_export/errors.py" = 100
"tg_export/exporter.py" = 45
"tg_export/format.py" = 50
"tg_export/html/renderer.py" = 65
"tg_export/importer.py" = 70
"tg_export/locking.py" = 85
"tg_export/privacy.py" = 85
"tg_export/media.py" = 50
"tg_export/models.py" = 85
"tg_export/session.py" = 80
"tg_export/state.py" = 65
"tg_export/verify.py" = 90

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["export_output", "docs/reviews", "docs/__check"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE790"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (used by Click)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["tg_export", "tests"]
exclude = ["export_output", "docs/reviews", "docs/__check", ".venv"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"

[tool.setuptools.packages.find]
include = ["tg_export*"]

# Without this the wheel carries only *.py: the Jinja templates and the static
# assets the renderer copies next to the export would be missing, and `run`
# would fail with TemplateNotFound on any pip-installed copy.
[tool.setuptools.package-data]
"tg_export.html" = [
    "templates/*.j2",
    "static/css/*.css",
    "static/js/*.js",
    "static/images/*.svg",
]

[project.scripts]
tg-export = "tg_export.cli:run_cli"
