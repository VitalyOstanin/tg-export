[build-system]
# setuptools is held at 83.0.0 or newer. Two of the three OSV entries below it
# (command injection through a package URL, path traversal in
# PackageIndex.download) are already closed at 82.0.0; the one that remains
# there -- GHSA-h35f-9h28-mq5c, Unicode normalisation letting a file past the
# MANIFEST.in exclusions of an sdist -- needs a case-insensitive filesystem
# (macOS APFS/HFS+), while the sdist of this project is built on ubuntu-24.04.
# The bound stays as the plain choice of a release with none of them, not as a
# fix for something this pipeline is exposed to.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-export"
version = "2.0.0"
description = "Flexible Telegram data export tool"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Vitaly Ostanin", email = "vitaly.ostanin@gmail.com"}]
# What is declared is what CI exercises: Linux and the Python versions of the
# matrix. macOS is expected to work -- the file lock uses fcntl, which is there
# -- but nothing runs on it, so it is stated in the README rather than claimed
# to an installer here. On Windows the session file lock degrades into a no-op
# (no fcntl) and the signal handlers are not installed.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    # Lower bound: 1.43.0 brought session schema v8, which FixedSQLiteSession
    # works around, and the python-socks check the proxy extra relies on --
    # before it a proxy without python-socks was served by PySocks instead, and
    # the contract test of the session schema is red.
    # Upper bound: Telethon v2 rewrites the session layer, and SQLiteSession --
    # which FixedSQLiteSession subclasses to work around the column-order bug --
    # does not exist there in its current form.
    "telethon>=1.43,<2",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    # 3.1.6 is the first release without the five sandbox-escape and
    # attribute-injection advisories that affect 3.1.0-3.1.5.
    "jinja2>=3.1.6",
    # 8.3.3 fixes the command injection in click.edit() (CVE-2026-7246). The
    # project never calls that function; the floor keeps it out of anyone's
    # environment regardless.
    "click>=8.3.3",
    "rich>=15.0",
    # A dependency of the tool rather than an option of it: Telethon ignores
    # `proxy=` when python_socks is missing, so an installation without it
    # cannot serve a configuration that names a proxy -- and which of the two
    # a particular run needs is decided by the config file, not by the person
    # installing the package. At the pinned 2.8.2 it costs one package of
    # 380 KB and nothing transitively; older releases within the bound do pull
    # `async-timeout` on every Python version -- the marker limiting it to
    # 3.10 and below appeared later in the 2.x line.
    # The `[asyncio]` extra is what Telethon's async client needs. Upper bound:
    # python-socks 3.0.0 (2026-08-11) drops the public `proxy_host` /
    # `proxy_port` properties of `AsyncioProxy` (2.8.2 defines them in
    # python_socks/async_/asyncio/_proxy.py; 3.0.0 defines them nowhere), while
    # telethon 1.44 reads `proxy.proxy_host` / `proxy.proxy_port` in
    # network/connection/connection.py. That branch only runs when `local_addr`
    # is set, which this project never does, so the break is telethon's rather
    # than ours -- but it is a concrete removal of something telethon relies
    # on, and the bound stays until telethon states support for 3.x. Since the
    # package moved into the main dependencies, this ceiling applies to every
    # installation, not only to the one that uses a proxy: a comparison of the
    # 2.8.2 and 3.0.0 wheels shows that everything else telethon 1.44 reaches
    # for is still there.
    "python-socks[asyncio]>=2.0,<4",
]

[project.urls]
Homepage = "https://github.com/VitalyOstanin/tg-export"
Repository = "https://github.com/VitalyOstanin/tg-export"
Issues = "https://github.com/VitalyOstanin/tg-export/issues"

[project.optional-dependencies]
# Kept, and empty: python-socks moved into the dependencies above, but
# `pip install 'tg-export[proxy]'` and `uv tool install 'tg-export[proxy]'`
# are written down in older instructions and in the messages of released
# versions. An unknown extra is a warning at best and an error at worst, so
# the name stays and now adds nothing.
proxy = []

# Development tools are a group (PEP 735), not an extra: an extra lands in the
# wheel metadata and is offered to the installer, while a group exists only in
# the source tree. The practical effect is that `uv sync` installs the `dev`
# group by default, so asking for another set (`uv sync --extra proxy`) no
# longer washes pytest and ruff out of the environment.
[dependency-groups]
# Lower bounds state what the project is verified against (see uv.lock), not
# the oldest version it once built with: an environment created without the
# lock file would otherwise get a different tool. pytest-asyncio 1.x is a case
# of its own -- in 0.x the `asyncio_mode = "auto"` mode behaved differently.
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "pyright>=1.1.411",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --cov lives here, not only in CI: without it the fail_under threshold is not
# checked locally and a drop in coverage surfaces only after the push.
addopts = "-ra --strict-markers --strict-config --cov=tg_export"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:telethon",
]
timeout = 60

[tool.coverage.run]
source = ["tg_export"]

[tool.coverage.report]
# Project-wide floor. Checked by every run with --cov (see addopts).
fail_under = 50

# Per-module floors: the project-wide threshold on its own hides a large file
# falling behind, carried by well covered small ones. Each floor sits five
# points below the number the module actually reaches, so a regression fails
# the run while ordinary variation between matrix entries does not. A floor
# goes down only together with the change that lowers the coverage, as a
# deliberate step -- never to make a red run green. Revisit the table when a
# module gains coverage worth holding on to; the gate names the modules whose
# floor has fallen more than five points behind. Checked by
# scripts/coverage_gate.py after a run with --cov.
[tool.tg-export.coverage-floor]
"tg_export/__init__.py" = 100
"tg_export/html/__init__.py" = 100
"tg_export/__main__.py" = 0
"tg_export/api.py" = 73
"tg_export/auth.py" = 88
"tg_export/catalog.py" = 77
"tg_export/cli/__init__.py" = 90
"tg_export/cli/account.py" = 83
"tg_export/cli/auth.py" = 67
"tg_export/cli/common.py" = 90
"tg_export/cli/export.py" = 75
"tg_export/cli/state.py" = 75
"tg_export/cli/takeout.py" = 90
"tg_export/cli/tg.py" = 83
"tg_export/config.py" = 92
"tg_export/console.py" = 100
"tg_export/converter.py" = 83
"tg_export/errors.py" = 100
"tg_export/exporter.py" = 77
"tg_export/format.py" = 92
"tg_export/html/renderer.py" = 75
"tg_export/importer.py" = 73
"tg_export/locking.py" = 90
"tg_export/privacy.py" = 87
"tg_export/media.py" = 84
"tg_export/models.py" = 90
"tg_export/session.py" = 82
"tg_export/state.py" = 88
"tg_export/verify.py" = 94
"tg_export/waits.py" = 93

[tool.ruff]
target-version = "py311"
line-length = 110
# E501 is not ignored: the formatter wraps code but not a long string
# literal, and with the rule off the declared width held for everything except
# the lines that actually got long.
extend-exclude = ["export_output", "docs/reviews", "docs/__check"]

[tool.ruff.lint]
# RUF100 -- an unused `noqa`: a `return  # noqa: B012` survived with a note
# about keeping a coroutine signature stable, which B012 is not about at all.
# ANN2 -- a function without a return annotation: 136 of 483 functions had
# none, and the split was not by layer -- neighbouring functions of one
# module differed. Only the return type is required; annotating every
# parameter of the Telethon boundary would mostly write `Any`.
select = ["E", "F", "I", "UP", "B", "SIM", "PIE790", "RUF100", "ANN2"]
ignore = [
    "B008",  # function call in default arg (used by Click)
]

[tool.ruff.lint.per-file-ignores]
# A test says what it checks by its name and its body; a return annotation on
# `-> None` adds nothing there.
"tests/*" = ["B011", "ANN2"]
"scripts/*" = ["ANN2"]

[tool.pyright]
include = ["tg_export", "tests"]
exclude = ["export_output", "docs/reviews", "docs/__check", ".venv"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = "warning"
# An error in the package: the helper that made a value optional for every
# caller (`opened_state(..., required=...)`) is gone, and nothing in tg_export
# reads through a value that may be None. In the tests it stays a warning --
# they reach into private fields and set attributes of what a stub returned.
reportOptionalMemberAccess = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
# The package itself is imported from the root of the repository; without this
# every `from tg_export...` in the tests reads as an unresolved import.
extraPaths = ["."]
reportOptionalMemberAccess = "warning"

[tool.setuptools.packages.find]
include = ["tg_export*"]

# Without this the wheel carries only *.py: the Jinja templates and the static
# assets the renderer copies next to the export would be missing, and `run`
# would fail with TemplateNotFound on any pip-installed copy.
[tool.setuptools.package-data]
"tg_export.html" = [
    "templates/*.j2",
    "static/css/*.css",
    "static/js/*.js",
    "static/images/*.svg",
]

[project.scripts]
tg-export = "tg_export.cli:run_cli"
